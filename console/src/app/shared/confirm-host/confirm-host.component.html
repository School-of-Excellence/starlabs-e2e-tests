@if (confirm.pending(); as p) {
  <div class="overlay" (click)="confirm.cancel()">
    <div
      class="dialog"
      [attr.data-tone]="p.tone || 'default'"
      (click)="$event.stopPropagation()"
      role="dialog"
      aria-modal="true"
    >
      <h3 class="title">{{ p.title }}</h3>
      <p class="msg">{{ p.message }}</p>

      @if (p.details && p.details.length) {
        <div class="details">
          @if (p.detailsHeading) {
            <div class="dhead">{{ p.detailsHeading }}</div>
          }
          <ul>
            @for (d of p.details; track d) {
              <li>{{ d }}</li>
            }
          </ul>
        </div>
      }

      <div class="btns">
        <button class="ghost" (click)="confirm.cancel()">{{ p.cancelLabel || 'Cancel' }}</button>
        <button class="go" [attr.data-tone]="p.tone || 'default'" (click)="confirm.confirm()">
          {{ p.confirmLabel || 'Confirm' }}
        </button>
      </div>
    </div>
  </div>
}

    <div class="bar">
      <input
        class="search"
        type="search"
        placeholder="Search branch, repo, commit…"
        [value]="f().search"
        (input)="patch({ search: asValue($event) })"
      />

      <div class="repo-chips" role="group" aria-label="Filter by repo">
        <button
          type="button"
          class="chip"
          [class.active]="f().repo === ''"
          (click)="patch({ repo: '' })"
        >
          All repos
        </button>
        @for (r of repos(); track r) {
          <button
            type="button"
            class="chip"
            [class.active]="f().repo === r"
            (click)="patch({ repo: r })"
          >
            {{ r }}
          </button>
        }
      </div>

      <select [value]="f().status" (change)="patch({ status: asValue($event) })">
        <option value="">All statuses</option>
        @for (s of statuses; track s.value) {
          <option [value]="s.value">{{ s.label }}</option>
        }
      </select>

      @if (dirty()) {
        <button class="link" (click)="reset()">Clear</button>
      }

      @if (pending() > 0) {
        <span class="pending-chip" [title]="pending() + ' ' + pendingLabel()">
          {{ pending() }} {{ pendingLabel() }}
        </span>
      }
    </div>

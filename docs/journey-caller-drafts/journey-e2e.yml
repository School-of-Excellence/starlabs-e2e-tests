# journey-e2e — THIN CALLER for the Stage-2 hermetic Playwright gate (JOURNEY & PRODUCTS system).
#
# DRAFT — destination: starlabs-angular/.github/workflows/journey-e2e.yml
#         (replaces the current STANDALONE journey-e2e.yml on the `journey-gate` branch).
#
# The gate logic lives in the hub (starlabs-e2e-tests/.github/workflows/web-e2e.yml). This file just wires the
# app's PR triggers + path filters to it, and selects the JOURNEY suite via `config` + `suite`. To change
# boot/seed/run behaviour, edit the hub workflow once and every repo inherits it (SETUP.md §6.3 "invert to reusable").
# This mirrors queue-e2e.yml exactly; only the name, paths, and the config/suite/only values differ.
#
# Requires: a repo secret REPO_PAT (read access to the private e2e + cloud-function repos), passed via
# `secrets: inherit`. The hub repo must allow its workflows to be reused org-wide (Settings → Actions → Access).
#
# ⚠️ PREREQS before this caller can go green on `@main` (see README.md in this folder):
#   1. web-e2e.yml on hub `main` must expose the new `config` + `suite` inputs (see web-e2e.proposed.yml).
#   2. The journey ENGINE must be on hub `main`: playwright.journey.emulator.config.ts,
#      journey/support/emulator-global-setup.ts + -teardown.ts, seed-journey.js (initAdminAuto), the JP-09 fix,
#      and the ci/overlay/environment.emulator.ts null fix  (the Phase-4 hub PR: journey-gate -> main).
#   Until both land on main, VALIDATE by pointing `e2e_ref:` (and the `uses:` ref) at the hub feature branch.
name: journey-e2e (emulator gate)

on:
  pull_request:
    branches: [cicd-dev, cicd-prod]   # sudo branches — MATCH queue. Switch to [development] at cutover.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'src/app/Journey Onboarding/**'
      - 'src/app/journey-onboarding-detail/**'
      - 'src/app/**.guard.ts'
      - 'angular.json'
      - 'package.json'
      - '.github/workflows/journey-e2e.yml'
  workflow_dispatch:
    inputs:
      only:
        description: 'Spec subset (space-separated). Empty = all journey specs.'
        type: string
        default: ''
      evidence:
        description: '1 = capture screenshots + traces (to debug a CI-only failure)'
        type: string
        default: '0'

jobs:
  gate:
    # Cost control: skip the heavy gate on DRAFT PRs unless explicitly labeled `run-e2e`.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')
    uses: School-of-Excellence/starlabs-e2e-tests/.github/workflows/web-e2e.yml@main
    with:
      cf_branch: development
      e2e_ref: main                                  # TEMP: set to `journey-gate` until the journey engine lands on main
      firebase_project: starlabs-cicd                # MUST match the app's projectId or auth silently fails (SETUP §3)
      config: playwright.journey.emulator.config.ts  # NEW input — selects the JOURNEY suite (config drives testDir + seed)
      suite: journey                                 # NEW input — default spec root (find journey/) + history audit tag
      # PR gate = the FULL journey suite (16 tests, green in CI). Empty `only` => run-isolated.sh auto-discovers
      # journey/*.spec.ts (requires the SUITE_DIR generalisation — see README). A manual workflow_dispatch can
      # override only/evidence to debug a single spec. Fallback if run-isolated.sh is NOT generalised: set the
      # default below to 'journey/catalog.spec.ts journey/purchase.spec.ts journey/journey-deep.spec.ts'.
      only: ${{ (github.event_name == 'workflow_dispatch' && inputs.only) || '' }}
      evidence: ${{ (github.event_name == 'workflow_dispatch' && inputs.evidence) || '0' }}
    secrets: inherit
